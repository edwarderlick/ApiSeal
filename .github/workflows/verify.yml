name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      GENVM_VERSION: "genlayerlabs-genvm-manager-v0.6.0-rc9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache GenVM SDK runners
        uses: actions/cache@v4
        id: genvm-cache
        with:
          path: ~/.cache/genvm-linter
          key: genvm-v0.6.0-rc9-sdk-runners-v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Setup GenVM v0.6.0-rc9 SDK runners
        if: steps.genvm-cache.outputs.cache-hit != 'true'
        run: |
          python - << 'EOF'
          import urllib.request, tarfile, zipfile, io
          from pathlib import Path

          cache_dir = Path.home() / '.cache' / 'genvm-linter'
          cache_dir.mkdir(parents=True, exist_ok=True)
          
          # Create placeholder tarball and index so genvm-lint uses extracted runners
          tarball_name = 'genvm-universal-genlayerlabs-genvm-manager-v0.6.0-rc9.tar.xz'
          tarball_path = cache_dir / tarball_name
          if not tarball_path.exists():
              tarball_path.touch()
          (cache_dir / f"{tarball_name}.index.json").write_text('{}')

          # Extracted runner paths (genvm-lint appends .tar to version stem)
          ext_base = cache_dir / 'extracted' / 'genlayerlabs-genvm-manager-v0.6.0-rc9.tar'
          py_lib_dir = ext_base / 'py-lib-genlayer-std' / 'z7fv8bqpetj3wnjd8sn5s5xfqve3rz8nmtq4npwf2qdvns57zjgg'
          py_genlayer_dir = ext_base / 'py-genlayer' / 'babwp9t37jw9g4j2bccgn14g6x7x9s1f7dsmh7emvz735pz4zxa0'

          if not (py_lib_dir.exists() and py_genlayer_dir.exists()):
              print('Downloading GenVM v0.6.0-rc9 universal runner bundle...')
              url = 'https://github.com/genlayerlabs/genvm-manager/releases/download/v0.6.0-rc9/genvm-universal.tar.xz'
              req = urllib.request.Request(url, headers={'User-Agent': 'ApiSeal-CI'})
              with urllib.request.urlopen(req) as resp:
                  tarball_data = resp.read()
              print(f'Downloaded {len(tarball_data)} bytes. Extracting required runners...')
              with tarfile.open(fileobj=io.BytesIO(tarball_data), mode='r:xz') as outer_tar:
                  # Extract py-genlayer runner zip
                  m1 = outer_tar.getmember('runners/py-genlayer/ba/bwp9t37jw9g4j2bccgn14g6x7x9s1f7dsmh7emvz735pz4zxa0.zip')
                  f1 = outer_tar.extractfile(m1)
                  py_genlayer_dir.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(f1) as zf1:
                      zf1.extractall(py_genlayer_dir)

                  # Extract py-lib-genlayer-std runner zip
                  m2 = outer_tar.getmember('runners/py-lib-genlayer-std/z7/fv8bqpetj3wnjd8sn5s5xfqve3rz8nmtq4npwf2qdvns57zjgg.zip')
                  f2 = outer_tar.extractfile(m2)
                  py_lib_dir.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(f2) as zf2:
                      zf2.extractall(py_lib_dir)

              print('GenVM v0.6.0-rc9 runners extracted successfully.')
          EOF

      - name: Lint and validate contract AST
        run: genvm-lint check contracts/apiseal.py

      - name: Run direct contract unit tests
        run: pytest tests/direct/test_apiseal.py -q

      - name: Verify integration suite skips cleanly without live opt-in
        run: pytest tests/integration/test_apiseal_live.py -q

      - name: Typecheck TypeScript scripts
        run: npx tsc --noEmit
