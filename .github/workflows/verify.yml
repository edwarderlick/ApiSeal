name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Lint and validate contract AST
        run: genvm-lint check contracts/apiseal.py

      - name: Run direct contract unit tests
        run: pytest tests/direct/test_apiseal.py -q

      - name: Verify integration suite skips cleanly without live opt-in
        run: pytest tests/integration/test_apiseal_live.py -q

      - name: Typecheck TypeScript scripts
        run: npx tsc --noEmit
